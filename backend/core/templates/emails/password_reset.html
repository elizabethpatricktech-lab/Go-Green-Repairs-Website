{% extends "emails/base.html" %} {% block title %} Reset Password {% endblock %}
{% block content %}

<h2>Hello {{ first_name }},</h2>

<p>We received a request to reset your password.</p>

<p>
  <a
    href="{{ reset_link }}"
    style="
      background: #1f7a3d;
      color: white;
      padding: 14px 24px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
    "
  >
    Reset Password
  </a>
</p>

<p>If you didn't request this, you can safely ignore this email.</p>

{% endblock %}
