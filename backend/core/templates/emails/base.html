<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}{% endblock %}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    "
  >
    <h1 style="color: #198754; text-align: center; margin-bottom: 30px">
      <img href="frontend/src/assets/Go Green Repairs Logo.PNG" />
    </h1>
    <table
      width="600"
      align="center"
      cellpadding="0"
      cellspacing="0"
      style="
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      "
    >
      <tr>
        <td
          style="
            background: #1f7a3d;
            color: white;
            padding: 24px;
            text-align: center;
          "
        >
          <h1 style="margin: 0">Go Green Repairs</h1>

          <p style="margin-top: 8px">Commercial Kitchen & Bakery HVAC</p>
        </td>
      </tr>

      <tr>
        <td style="padding: 32px">{% block content %} {% endblock %}</td>
      </tr>

      <tr>
        <td
          style="
            background: #f8f8f8;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            color: #666;
          "
        ></td>
      </tr>
    </table>
    <hr style="margin: 40px 0 20px; border: none; border-top: 1px solid #ddd" />

    <p
      style="color: #666; font-size: 14px; text-align: center; line-height: 1.6"
    >
      <strong>Go Green Repairs</strong><br />

      HVAC and Commercial Kitchen & Bakery Contractor

      <br /><br />

      Questions? Reply to this email or contact us through our website.

      <br /><br />

      © {% now "Y" %} Go Green Repairs. All rights reserved.
    </p>
  </body>
</html>
